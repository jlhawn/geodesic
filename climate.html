<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Climate model</title>
  <style>
    body { margin: 0; background: #151515; color: #ddd; font: 14px system-ui, sans-serif; }
    #globe { position: absolute; inset: 0; }
    #panel { position: absolute; top: 12px; left: 12px; z-index: 10; display: flex; gap: 10px; align-items: center; background: rgba(0, 0, 0, 0.55); padding: 8px 12px; border-radius: 6px; }
    #readout { position: absolute; bottom: 12px; left: 12px; z-index: 10; background: rgba(0, 0, 0, 0.55); padding: 6px 10px; border-radius: 6px; }
    select, button { font: inherit; }
  </style>
</head>

<body>
  <div id="globe"></div>
  <div id="panel">
    <label>Field <select id="field">
        <option value="ps">Surface pressure</option>
        <option value="ts">Surface temperature</option>
        <option value="wind">Surface wind speed</option>
      </select></label>
    <button id="pause">Pause</button>
  </div>
  <div id="readout">starting…</div>
  <script type="module">
    import runClimate from './js/climate.module.js';
    runClimate(Number(new URLSearchParams(location.search).get('N') ?? 16));
  </script>
</body>

</html>
