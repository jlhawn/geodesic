<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Synoptic charts</title>
  <meta name="description" content="Weather-map plots drawn from saved WebGCM states: geopotential height contours and wind speed at standard pressure levels, downloadable as SVG or PNG.">
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#f4f4f2">
  <meta property="og:site_name" content="WebGCM">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Synoptic charts · WebGCM">
  <meta property="og:description" content="Weather-map plots drawn from saved WebGCM states: geopotential height contours and wind speed at standard pressure levels, downloadable as SVG or PNG.">
  <meta property="og:image" content="https://gcm.echorelay.net/screenshots/share.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="WebGCM's simulated Earth seen from space: Africa and Europe under the model's own clouds">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image:alt" content="WebGCM's simulated Earth seen from space: Africa and Europe under the model's own clouds">
  <style>
    body { margin: 0; background: #f4f4f2; color: #222; font: 14px system-ui, sans-serif; }
    #panel { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 16px; background: #fff; border-bottom: 1px solid #ddd; }
    #status { color: #666; }
    #chart { padding: 16px; }
    #chart svg { width: 100%; height: auto; max-width: 1600px; display: block; background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15); }
    select, button { font: inherit; }
  </style>
</head>

<body>
  <div id="panel">
    <label>Run <select id="state"></select></label>
    <label>Level <select id="level"></select></label>
    <button id="download-svg">Download SVG</button>
    <button id="download-png">Download PNG</button>
    <span id="status">loading…</span>
  </div>
  <div id="chart"></div>
  <script type="module">
    import runCharts from './js/charts.module.js';
    runCharts();
  </script>
</body>

</html>
